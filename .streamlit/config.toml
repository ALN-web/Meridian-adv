[theme]
base = "light"
primaryColor = "#0e0e0e"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f3"
textColor = "#0e0e0e"
borderColor = "#e6e6e2"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
# Serves src/meridian/ui/static/ at /app/static/ (three.js for the 3D headers, no CDN needed)
enableStaticServing = true
