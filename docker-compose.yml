# docker compose up  ->  operator screen :8510, website :8700, fake portal :8600
# Secrets come from .env (copy .env.example). Nothing secret is baked into the image.
services:
  agent:
    build: .
    env_file: .env
    environment:
      WEBSITE_URL: http://localhost:8700/
      FAKE_PORTAL_URL: http://fakeportal:8600
    ports: ["8510:8510"]
    volumes:
      - ./runs:/app/runs
      - ./data:/app/data
      - ./.auth:/app/.auth
    depends_on: [fakeportal]

  fakeportal:
    build: .
    command: ["python", "-m", "meridian.fakeportal.server"]
    environment:
      FAKE_PORTAL_HOST: 0.0.0.0
      FAKE_PORTAL_PORT: "8600"
    ports: ["8600:8600"]

  # Stretch goal: last month's whole-month check, every month (day 2, 07:10 IST). Opt-in:
  #   docker compose --profile scheduler up -d
  # OTPs (if the saved session has expired) are typed in the operator screen, which shares runs/.
  scheduler:
    build: .
    profiles: ["scheduler"]
    command: ["python", "harness/schedule_month.py", "--mode", "live"]
    env_file: .env
    environment:
      TZ: Asia/Kolkata
    volumes:
      - ./runs:/app/runs
      - ./data:/app/data
      - ./.auth:/app/.auth
    restart: unless-stopped

  website:
    image: python:3.12-slim
    command: ["python", "-m", "http.server", "8700", "--directory", "/web"]
    volumes: ["./web:/web:ro"]
    ports: ["8700:8700"]
